name: Publish website (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/build.py
      - run: python scripts/check_site.py
      - run: node --check main.js
      - run: node --check assistant.js
      - run: node --test tests/assistant.test.cjs
      - run: node --test tests/contact.test.cjs
      - run: node --test tests/visits.test.cjs
      - run: python scripts/package_site.py
      - run: node --test tests/security.test.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@v4
